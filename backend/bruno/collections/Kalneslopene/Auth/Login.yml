info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/auth/login"
  headers:
    - name: X-XSRF-TOKEN
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
          "username": "user",
          "password": "ourpassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
