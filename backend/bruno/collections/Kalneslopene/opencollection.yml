opencollection: 1.0.0

info:
  name: Kalneslopene
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

# HTTP Basic is no longer accepted. Run Auth/Get CSRF token, then Auth/Login — the session
# cookie is then reused from Bruno's cookie jar for every later request.
request:
  auth:
    type: none

script:
  req: |-
    // Spring rejects writing requests without this header. Auth/Get CSRF token populates the var.
    const csrfToken = bru.getVar("csrfToken");
    if (csrfToken) {
      req.setHeader("X-XSRF-TOKEN", csrfToken);
    }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
