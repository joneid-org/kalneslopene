spring:
  application:
    name: kalneslopene
  datasource:
    url: jdbc:postgresql://localhost:5432/torsdagslopet
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  liquibase:
    drop-first: true
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none

baseline-data:
  enabled: false # True to test with baselinedata
mockdata:
  enabled: true # True to test with mockdata

# One-off repair of runner/race_runner from the Resultater/v2 csv files. See scripts/results-repair.md.
# Turn enabled on for a single boot, then off again. dry-run logs the full report and rolls back.
results-repair:
  enabled: false
  dry-run: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: torsdagslopet