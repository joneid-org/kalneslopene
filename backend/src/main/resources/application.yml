spring:
  application:
    name: kalneslopene
  liquibase:
    drop-first: false
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 20

# One-off repair of runner/race_runner from the Resultater/v2 csv files. See scripts/results-repair.md.
# Turn enabled on for a single boot, then off again. dry-run logs the full report and rolls back.
results-repair:
  enabled: false
  dry-run: false

ordering:
  baseline: 100
  repair: 200

# Error tracking. An empty DSN disables the SDK entirely, so local dev and tests are unaffected.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# Served to the browser by /api/config. Separate DSN from the backend one so frontend
# errors land in their own GlitchTip project.
client-config:
  sentry-dsn: ${SENTRY_FRONTEND_DSN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
